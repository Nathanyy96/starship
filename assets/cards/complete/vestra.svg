<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-label="維斯妲 ★★★★ 星">
  <rect width="1024" height="1536" fill="#080d22"/>
  <image href="../vestra.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="xMidYMid meet"/>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".8"/>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05091a" stop-opacity=".96"/>
      <stop offset="1" stop-color="#e4b86b" stop-opacity=".64"/>
    </linearGradient>
  </defs>
  <g transform="translate(38 38)" filter="url(#softShadow)">
    <rect x="0" y="0" width="390" height="220" rx="24" fill="url(#panel)" stroke="#e5edff" stroke-opacity=".5"/>
    <text x="30" y="52" fill="#d9faff" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" letter-spacing="4">STAR-LAW / PORTRAIT</text>
