<script>
(function(){
  var byId=function(id){return document.getElementById(id);},state=StarshipFirstActGame.initial(),controller=null,village=null;
  function show(zone){
    if(controller)controller.close();if(village)village.close();
    byId('first-act-view').hidden=zone==='village';byId('exploration-panel').hidden=zone!=='village';
    document.querySelectorAll('[data-zone]').forEach(function(button){button.setAttribute('aria-pressed',String(button.dataset.zone===zone));});
    if(zone==='village'){
      if(!village)village=StarshipExploration.create({canvas:byId('exploration-canvas'),panel:byId('exploration-panel'),status:byId('village-status'),position:byId('village-position'),discoveries:byId('village-discoveries'),objective:byId('village-objective'),distance:byId('village-distance'),interact:byId('village-interact'),reset:byId('village-reset'),read:byId('village-complete'),pad:byId('exploration-panel'),dialog:byId('village-dialog'),dialogTitle:byId('village-speaker'),dialogText:byId('village-line'),dialogNext:byId('village-next'),load:function(){return Object.assign(StarshipExploration.initial(),{arrived:true,x:1250,y:440});},save:function(){}});
      village.reload();village.open();return;
    }
    state=zone==='forest'?{index:4,zone:'forest',x:4.5,y:15.8}:StarshipFirstActGame.initial();
    if(!controller)controller=StarshipFirstActGame.create({canvas:byId('first-act-canvas'),panel:byId('preview-panel'),zone:byId('preview-zone'),objective:byId('preview-objective'),distance:byId('preview-distance'),interact:byId('preview-interact'),dialog:byId('preview-dialog'),dialogTitle:byId('preview-speaker'),dialogText:byId('preview-line'),dialogNext:byId('preview-next'),reset:byId('preview-reset'),enter:byId('preview-enter'),pad:byId('preview-panel'),load:function(){return state;},save:function(next){state=next;}});
    controller.open();
  }
  document.querySelectorAll('[data-zone]').forEach(function(button){button.addEventListener('click',function(){show(button.dataset.zone);});});byId('preview-enter').addEventListener('click',function(){show('village');});show('valley');
}());
