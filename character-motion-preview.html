<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星律｜旅人步伐</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c22;color:#ede8d8;font:16px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:36px 20px}header{border-bottom:1px solid #4a5a54;padding-bottom:24px}h1{font-size:30px;margin:4px 0}p{color:#b7c9c2;margin:8px 0}.toolbar{display:flex;flex-wrap:wrap;gap:20px;align-items:center;margin:24px 0}select,button,a{font:inherit;color:inherit}select,button{background:#21362e;border:1px solid #718779;padding:9px 14px;border-radius:6px;min-height:44px}a{color:#ddce9c;text-underline-offset:4px}#cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:16px}article{border:1px solid #354b44;border-radius:8px;overflow:hidden;background:#172b24}canvas{width:100%;height:180px;display:block;background:radial-gradient(ellipse at 50% 85%,#435445 0,#243b30 45%,#182b26 75%)}article h2{font-size:17px;margin:10px 14px 4px}article nav{display:flex;gap:12px;padding:0 14px 16px;font-size:13px}.loading{padding:24px}
</style></head><body><main><header><a href="./">← 返回遊戲</a><h1>旅人步伐</h1><p>1.0–1.1 全角色・四方向行走。可進入劇情場景與大世界，比較同一角色的進場外觀。</p></header><div class="toolbar"><label>面向 <select id="direction"><option value="down">向前</option><option value="left">向左</option><option value="up">向後</option><option value="right">向右</option></select></label><button id="walking" type="button" aria-pressed="true">暫停步伐</button><span id="status" role="status">正在準備旅人…</span></div><section id="cast" aria-label="角色行走預覽"></section></main><script src="./src/character-motion-manifest.js?v=cast-motion-v2"></script><script src="./src/character-motion.js?v=cast-motion-v2"></script><script>
(function(){var motion=StarshipCharacterMotion,cast=document.getElementById('cast'),direction=document.getElementById('direction'),button=document.getElementById('walking'),status=document.getElementById('status'),walking=!matchMedia('(prefers-reduced-motion: reduce)').matches,ready=0,tiles=[],distance=0,last=0;
function updateButton(){button.textContent=walking?'暫停步伐':'播放步伐';button.setAttribute('aria-pressed',String(walking));}updateButton();button.onclick=function(){walking=!walking;updateButton();};
Object.keys(motion.manifest).forEach(function(id){var item=motion.manifest[id],article=document.createElement('article'),title=document.createElement('h2'),canvas=document.createElement('canvas'),links=document.createElement('nav');canvas.width=400;canvas.height=360;canvas.setAttribute('aria-label',item.name+'四方向走路動畫');title.textContent=item.name;links.innerHTML='<a href="./opening-scene-preview.html?character='+id+'">劇情場景</a><a href="./first-major-terrain-preview.html?character='+id+'">大世界</a>';article.append(canvas,title,links);cast.append(article);var tile={canvas:canvas,image:null,id:id};tiles.push(tile);motion.load(id,function(image){tile.image=image;if(image)ready++;status.textContent=ready+' / '+tiles.length+' 位旅人已就緒';});});
function draw(time){if(walking&&last)distance+=(time-last)*.13;last=time;tiles.forEach(function(tile){var ctx=tile.canvas.getContext('2d');ctx.clearRect(0,0,400,360);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(200,320,75,15,0,0,Math.PI*2);ctx.fill();motion.draw(ctx,tile.image,200,311,265,direction.value,distance,walking,false,tile.id);});requestAnimationFrame(draw);}requestAnimationFrame(draw);
}());</script></body></html>
