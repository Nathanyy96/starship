services:
  - type: web
    name: starship-gacha
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node serve.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STARSHIP_ADMIN_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: starship-db
          property: connectionString
      - key: STARSHIP_DATA_DIR
        value: ./data
      # 測試服才填 true；正式公開服請保持 false 或不要設定。
      - key: STARSHIP_TEST_REWARDS
        sync: false

databases:
  - name: starship-db
    plan: free
    databaseName: starship
    user: starship
